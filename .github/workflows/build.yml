name: Build ItsM3liodas Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fabric 1.21.11
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP files
        run: |
          mkdir -p extracted
          find . -maxdepth 1 -type f -iname '*.zip' -print0 |
          while IFS= read -r -d '' file; do
            echo "Extracting: $file"
            unzip -oq "$file" -d extracted
          done

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          PROJECT_FILE=$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Could not find build.gradle. Check the ZIP contents."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Found: $PROJECT_FILE"
          echo "dir=$(dirname "$PROJECT_FILE")" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build client
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ItsM3liodas-Client-Fabric-1.21.11
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
