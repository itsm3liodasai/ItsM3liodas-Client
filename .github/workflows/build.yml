
name: Build ItsM3liodas Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fabric Minecraft 26.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Check project files
        run: |
          ls -la
          test -f build.gradle || test -f build.gradle.kts

      - name: Build client
        run: gradle --no-daemon clean build

      - name: Upload client JAR
        uses: actions/upload-artifact@v4
        with:
          name: ItsM3liodas-Client-26.3
          path: build/libs/*.jar
          if-no-files-found: error
