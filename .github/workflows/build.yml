name: Build Mod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build (compiles, runs tests, fails on error)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Verify a real JAR was produced
        run: |
          ls -la build/libs/
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | grep -v -- '-dev' | head -n1)
          test -n "$JAR" || { echo "No JAR built"; exit 1; }
          test "$(stat -c%s "$JAR")" -gt 10000 || { echo "JAR suspiciously small"; exit 1; }
          unzip -l "$JAR" | grep -q fabric.mod.json || { echo "fabric.mod.json missing"; exit 1; }

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ItsM3liodas-Client
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
