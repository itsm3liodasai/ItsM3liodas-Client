
name: Build ItsM3liodas Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - "1.21"
          - "1.21.1"
          - "1.21.4"
          - "1.21.8"
          - "1.21.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build client
        run: |
          gradle --no-daemon clean build \
            -Pminecraft_version=${{ matrix.minecraft }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ItsM3liodas-Client-${{ matrix.minecraft }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
